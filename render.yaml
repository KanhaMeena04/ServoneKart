services:
  - type: web
    name: servonekart
    runtime: node
    rootDir: ServoneBackend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://servonekart.onrender.com
      - key: BASE_PATH
        value: /api/v1
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SOCKET_IO_CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
