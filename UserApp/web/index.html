<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="description" content="Tricelyn Multi-Service Quick-Commerce Delivery App">

  <!-- Location Permission -->

  <meta name="permissions-policy" content="geolocation=(self)">

  <!-- iOS meta tags & icons -->

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="apple-mobile-web-app-title" content="Tricelyn">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Tricelyn</title>

  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FEFAF9;
      background-size: 100% 100%;
      overflow: hidden;
    }

    .splash-full {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>

  <script id="splash-screen-script">

    function removeSplashFromWeb() {

      document.getElementById("splash")?.remove();

      document.getElementById("splash-branding")?.remove();

      document.body.style.background = "transparent";

    }

  </script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCN7XqyxOj5lgr2uaMNrTOg6PzHTOGa0xU"></script>
  <script>
    window.fetchGoogleDirections = function(oLat, oLng, dLat, dLng) {
      return new Promise(function(resolve) {
        try {
          if (!window.google || !window.google.maps) {
            resolve('');
            return;
          }
          var directionsService = new window.google.maps.DirectionsService();
          directionsService.route({
            origin: new window.google.maps.LatLng(oLat, oLng),
            destination: new window.google.maps.LatLng(dLat, dLng),
            travelMode: window.google.maps.TravelMode.DRIVING
          }, function(response, status) {
            if (status === 'OK' && response && response.routes && response.routes[0]) {
              var poly = response.routes[0].overview_polyline;
              if (poly && typeof poly === 'string' && poly.length > 5) {
                resolve(poly);
              } else if (response.routes[0].overview_path && response.routes[0].overview_path.length > 0) {
                var pts = response.routes[0].overview_path.map(function(p) {
                  return p.lat().toFixed(6) + ',' + p.lng().toFixed(6);
                }).join('|');
                resolve(pts);
              } else {
                resolve('');
              }
            } else {
              resolve('');
            }
          });
        } catch (err) {
          resolve('');
        }
      });
    };
  </script>
</head>

<body>

  <picture id="splash">
    <source srcset="splash/splash_screen.jpg" media="(prefers-color-scheme: light)">
    <source srcset="splash/splash_screen.jpg" media="(prefers-color-scheme: dark)">
    <img class="splash-full" aria-hidden="true" src="splash/splash_screen.jpg" alt="Splash">
  </picture>

  <script src="flutter_bootstrap.js" async></script>

</body>

</html>
