analyzer:
  exclude:
    - "ServoneAdmin/**"
    - "ServoneBackend/**"
    - "TricelynWeb/**"
    - "Restaurant/**"
    - "ECDadmin/**"
    - "ECDbackend/**"
    - "**/node_modules/**"
    - "**/build/**"
    - "**/.dart_tool/**"
    - "**/android/**"
    - "**/ios/**"
    - "**/web/**"
    - "**/windows/**"
    - "**/macos/**"
    - "**/linux/**"
  errors:
    deprecated_member_use: ignore
    unused_import: ignore
    unused_element: ignore
    unused_local_variable: ignore
    unused_field: ignore
    avoid_print: ignore
    dead_code: ignore
    todo: ignore
